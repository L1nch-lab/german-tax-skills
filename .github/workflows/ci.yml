name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows zaehlt doppelt: Claude Code nutzt dort Git Bash, das Pfade umschreibt.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      # --group braucht pip >= 25.1 (PEP 735); das Repo selbst wird nicht installiert.
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Plugin- und Marktplatz-Manifest sind gueltiges JSON und passen zusammen
        run: |
          python - <<'EOF'
          import json, pathlib
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          entry = next(p for p in market["plugins"] if p["name"] == plugin["name"])
          assert entry["version"] == plugin["version"], (entry["version"], plugin["version"])
          print(f"{plugin['name']} {plugin['version']} ok")
          EOF
      - name: SKILL.md nennt nur Endpoints, die es in der Live-Spezifikation gibt
        run: python tools/build_reference.py
